</style></head><body>
<header>🏐 Vôlei <span>Performance</span><small id="st" style="float:right;font-weight:400;font-size:12px"></small></header><main id="app"></main>
<nav id="nav"></nav>
<script>
const POS=['Levantador','Oposto','Ponteiro','Central','Líbero'];
const FUND={Saque:['#facc15',['Dentro','Fora','Rede','Ponto']],Recepção:['#38bdf8',['Excelente','Positiva','Negativa','Erro']],Levantamento:['#22c55e',['Ideal','Bom','Regular','Ruim','Erro']],Ataque:['#ef4444',['Ponto','Defendido','Bloqueado','Fora','Rede']],Bloqueio:['#a855f7',['Ponto','Defendida','Fora','Rede']],Defesa:['#f97316',['Boa','Regular','Erro']]};
const POSITIVE=['Ponto','Dentro','Excelente','Positiva','Ideal','Bom','Boa'];
const defCrit=()=>[{n:'Salto vertical (cm)',w:3,d:1},{n:'Velocidade (s)',w:2,d:-1},{n:'Alcance de ataque (cm)',w:2,d:1},{n:'Erros de saque',w:1,d:-1}];
let db={teams:[],ath:[],crit:{},evals:[],acts:[]};
try{const x=localStorage.getItem('vp1');if(x)db=JSON.parse(x)}catch(e){}
POS.forEach(p=>{if(!db.crit[p])db.crit[p]=defCrit()});
const save=()=>{try{localStorage.setItem('vp1',JSON.stringify(db))}catch(e){}};
let S={tab:'in',a:'',fund:'Ataque',res:'Ponto',fl:'Todos',cmp:''};
const $=id=>document.getElementById(id),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const IC={in:'🏠',eq:'👥',at:'🏐',av:'📋',tr:'🎯',jg:'🏆',an:'📊'};
const TABS=[['in','Início'],['eq','Equipes'],['at','Atletas'],['av','Avaliações'],['tr','Treino'],['jg','Jogo'],['an','Análises']];
function go(t){S.tab=t;render()}
function render(){
 $('nav').innerHTML=TABS.map(([k,l])=>`<button class="${S.tab==k?'on':''}" onclick="go('${k}')">${IC[k]}<br>${l}</button>`).join('');
 $('app').innerHTML={in:vIn,eq:vEq,at:vAt,av:vAv,tr:vTr,jg:vJg,an:vAn}[S.tab]();
 if(S.tab=='tr'||S.tab=='jg')initCourt();if(S.tab=='an')initShot();
}
const v=id=>$(id).value;
/* Equipes */
function addTeam(){if(!v('tn').trim())return;db.teams.push({id:uid(),n:v('tn').trim(),c:v('tc')});save();render()}
function delTeam(id){if(confirm('Excluir equipe e seus atletas?')){const ids=db.ath.filter(a=>a.t==id).map(a=>a.id);db.ath=db.ath.filter(a=>a.t!=id);db.teams=db.teams.filter(t=>t.id!=id);db.evals=db.evals.filter(e=>!ids.includes(e.a));db.acts=db.acts.filter(e=>!ids.includes(e.a));save();render()}}
function vEq(){return `<div class="c"><h3>Nova equipe</h3><div class="row"><input id="tn" placeholder="Nome"><input id="tc" placeholder="Categoria"><button class="b" onclick="addTeam()">Adicionar</button></div></div>
<div class="c"><h3>Equipes (${db.teams.length})</h3>${db.teams.map(t=>`<div class="li row"><b>${esc(t.n)}</b><span class="mu">${esc(t.c)} · ${db.ath.filter(a=>a.t==t.id).length} atletas</span><button class="b r" style="margin-left:auto" onclick="delTeam('${t.id}')">Excluir</button></div>`).join('')||'<p class="mu">Nenhuma equipe ainda.</p>'}</div>
<div class="c"><h3>Backup</h3><p class="mu">Copie o texto e guarde em local seguro (e-mail, notas). Para restaurar, cole e toque em Restaurar.</p><textarea id="bk" rows="4" style="width:100%;background:var(--cd);color:var(--tx);border:1px solid var(--bd);border-radius:8px"></textarea><div class="row"><button class="b" onclick="exportDb()">Gerar e copiar backup</button><button class="b g" onclick="importDb()">Restaurar</button></div></div>`}
/* Atletas */
function addAth(){if(!v('an').trim()||!v('at_t'))return alert('Informe nome e equipe');const o={id:uid(),n:v('an').trim(),num:v('anum'),pos:v('ap'),ps:v('ap2'),t:v('at_t'),h:v('ah'),w:v('aw'),bd:v('abd'),sx:v('asx'),hd:v('ahd'),wg:v('awg'),rc:v('arc'),ph:''},f=$('apf').files[0],done=()=>{db.ath.push(o);save();render()};if(!f)return done();const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=140;const s=Math.min(im.width,im.height);c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,140,140);o.ph=c.toDataURL('image/jpeg',.7);done()};im.onerror=done;im.src=r.result};r.readAsDataURL(f)}
function delAth(id){if(confirm('Excluir atleta e histórico?')){db.ath=db.ath.filter(a=>a.id!=id);db.evals=db.evals.filter(e=>e.a!=id);db.acts=db.acts.filter(e=>e.a!=id);save();render()}}
const tn=id=>(db.teams.find(t=>t.id==id)||{}).n||'-';
function vAt(){return `<div class="c"><h3>Novo atleta</h3><div class="row"><input id="an" placeholder="Nome completo"><input id="anum" type="number" placeholder="Nº" style="width:70px"><select id="ap">${POS.map(p=>`<option>${p}</option>`).join('')}</select><select id="at_t"><option value="">Equipe…</option>${db.teams.map(t=>`<option value="${t.id}">${esc(t.n)}</option>`).join('')}</select><input id="ah" type="number" placeholder="Altura cm" style="width:100px"><input id="aw" type="number" placeholder="Peso kg" style="width:90px"><label class="mu">Nasc. <input id="abd" type="date"></label><select id="asx"><option value="">Sexo</option><option>Feminino</option><option>Masculino</option></select><select id="ahd"><option value="">Mão</option><option>Direita</option><option>Esquerda</option></select><select id="ap2"><option value="">Pos. secundária</option>${POS.map(p=>`<option>${p}</option>`).join('')}</select><input id="awg" type="number" step="0.01" placeholder="Envergadura m" style="width:125px"><input id="arc" type="number" step="0.01" placeholder="Alcance m" style="width:100px"><label class="mu">Foto <input id="apf" type="file" accept="image/*"></label><button class="b" onclick="addAth()">Adicionar</button></div></div>
<div class="c"><h3>Atletas (${db.ath.length})</h3>${db.ath.map(a=>`<div class="li row">${av(a)}<b>#${esc(a.num)} ${esc(a.n)}</b><span class="mu">${a.pos} · ${esc(tn(a.t))} · ${esc(a.h)}cm ${esc(a.w)}kg</span><button class="b g" style="margin-left:auto" onclick="S.a='${a.id}';go('av')">Ficha</button><button class="b r" onclick="delAth('${a.id}')">×</button></div>`).join('')||'<p class="mu">Nenhum atleta ainda.</p>'}</div>`}
/* Avaliações */
const A=()=>db.ath.find(a=>a.id==S.a);
const selAth=()=>`<select onchange="S.a=this.value;S.cmp='';render()"><option value="">Escolha o atleta…</option>${db.ath.map(a=>`<option value="${a.id}" ${a.id==S.a?'selected':''}>${esc(a.n)} (${a.pos})</option>`).join('')}</select>`;
function saveEval(){const a=A(),cr=db.crit[a.pos].map((c,i)=>({...c,v:parseFloat(v('ev'+i))}));if(cr.some(c=>isNaN(c.v)))return alert('Preencha todos os valores');db.evals.push({id:uid(),a:a.id,date:v('evd')||new Date().toISOString().slice(0,10),cr});save();render()}
function setC(p,i,k,val){const c=db.crit[p][i];c[k]=k=='n'?val:parseFloat(val)||0;save()}
function addC(p){db.crit[p].push({n:'Novo critério',w:1,d:1});save();render()}
function delC(p,i){db.crit[p].splice(i,1);save();render()}
function delEv(id){if(confirm('Excluir avaliação?')){db.evals=db.evals.filter(e=>e.id!=id);save();render()}}
const pct=(c,p)=>p.v==0?0:c.d*(c.v-p.v)/Math.abs(p.v)*100;
function vAv(){const a=A();let h=`<div class="c">${selAth()}</div>`;if(!a)return h;
 h+=`<div class="c row">${av(a).replace('class="av"','class="av" style="width:72px;height:72px;font-size:28px"')}<div><h3 style="margin:0">${esc(a.n)}</h3><span class="chip on">${a.pos}${a.ps?' · '+a.ps:''}</span><div class="mu">${ageOf(a.bd)!==''?ageOf(a.bd)+' anos · ':''}${esc(a.h)} cm · ${esc(a.w)} kg · ${esc(tn(a.t))}</div><div class="mu">Envergadura ${esc(a.wg||'-')} · Alcance ${esc(a.rc||'-')} · Mão ${esc(a.hd||'-')}</div></div></div>`;
 const ev=db.evals.filter(e=>e.a==a.id).sort((x,y)=>x.date<y.date?-1:1);
 h+=newEv(a);void`<div class="c"><h3>Nova avaliação — ${esc(a.n)}</h3><input id="evd" type="date" value="${new Date().toISOString().slice(0,10)}">${db.crit[a.pos].map((c,i)=>`<div class="row li"><span style="flex:1">${esc(c.n)} <span class="mu">(peso ${c.w})</span></span><input id="ev${i}" type="number" step="any" style="width:100px"></div>`).join('')}<button class="b" onclick="saveEval()">Salvar avaliação</button><p class="mu">Os critérios e pesos atuais são copiados para a avaliação e não mudam depois.</p></div>`;
 h+=`<div class="c"><h3>Histórico (${ev.length})</h3>${ev.map((e,i)=>`<div class="li row"><b>Avaliação ${i+1}</b><span class="mu">${e.date}</span>${e.prof?`<span class="up">Nota ${noteOf(e)}</span><span class="mu">${e.prof}</span>`:''}<button class="b g" style="margin-left:auto" onclick="S.cmp='${e.id}';render()">Comparar</button><button class="b r" onclick="delEv('${e.id}')">×</button></div>`).join('')||'<p class="mu">Sem avaliações.</p>'}</div>`;
 if(ev.length>1){const last=ev[ev.length-1],base=ev.find(e=>e.id==S.cmp)||ev[ev.length-2];
  h+=`<div class="c"><h3>Evolução</h3><p class="mu">${base.date} → ${last.date} (toque em Comparar para mudar a base)</p><div class="sc"><table><tr><th>Critério</th><th>Antes</th><th>Atual</th><th>Evolução</th></tr>${last.cr.map(c=>{const p=base.cr.find(x=>x.n==c.n);if(!p)return'';const r=pct(c,p);return`<tr><td>${esc(c.n)}</td><td>${p.v}</td><td>${c.v}</td><td class="${r>=0?'up':'dn'}">${r>0?'+':''}${r.toFixed(1)}%</td></tr>`}).join('')}</table></div></div>`}
 if(ev.length>1)h+=charts(ev,S.cmp);h+=wtEd(a);void`<div class="c"><h3>Critérios e pesos — ${a.pos}</h3>${db.crit[a.pos].map((c,i)=>`<div class="row li"><input value="${esc(c.n)}" onchange="setC('${a.pos}',${i},'n',this.value)" style="flex:1;min-width:140px"><input type="number" value="${c.w}" onchange="setC('${a.pos}',${i},'w',this.value)" style="width:60px"><select onchange="setC('${a.pos}',${i},'d',this.value)"><option value="1" ${c.d==1?'selected':''}>Maior é melhor</option><option value="-1" ${c.d==-1?'selected':''}>Menor é melhor</option></select><button class="b r" onclick="delC('${a.pos}',${i})">×</button></div>`).join('')}<button class="b g" onclick="addC('${a.pos}')">+ Critério</button></div>`;
 return h}
/* Treino */
let cv,cx,drag=null;
function vTr(){const a=A(),pts=db.acts.filter(x=>a&&x.a==a.id&&x.ctx!='jogo');
 let h=`<div class="c">${selAth()}<div class="row" style="margin-top:6px">${Object.keys(FUND).map(f=>`<button class="chip ${S.fund==f?'on':''}" onclick="S.fund='${f}';S.res=FUND['${f}'][1][0];render()">${f}</button>`).join('')}</div><div class="row" style="margin-top:6px">${FUND[S.fund][1].map(r=>`<button class="chip ${S.res==r?'on':''}" onclick="S.res='${r}';render()">${r}</button>`).join('')}</div></div>
<div class="c"><canvas id="cv" width="800" height="400"></canvas><p class="mu">Toque na origem, arraste até o destino e solte: a jogada é salva com o resultado selecionado.</p><div class="row"><button class="b g" onclick="undo()">Desfazer última</button><button class="b g" onclick="S.hm=!S.hm;render()">${S.hm?'Ver trajetórias':'Mapa de calor'}</button><select onchange="S.fl=this.value;render()"><option>Todos</option>${Object.keys(FUND).map(f=>`<option ${S.fl==f?'selected':''}>${f}</option>`).join('')}</select></div></div>`;
 if(a){h+=`<div class="c"><h3>Estatísticas — ${esc(a.n)}</h3><div class="sc"><table><tr><th>Fundamento</th><th>Total</th><th>Resultados</th><th>Efic.</th></tr>${Object.keys(FUND).map(f=>{const l=pts.filter(x=>x.f==f);if(!l.length)return'';const cnt={};l.forEach(x=>cnt[x.r]=(cnt[x.r]||0)+1);const ok=l.filter(x=>POSITIVE.includes(x.r)).length;return`<tr><td style="color:${FUND[f][0]};font-weight:700">${f}</td><td>${l.length}</td><td class="mu">${Object.entries(cnt).map(([k,n])=>k+' '+n).join(', ')}</td><td>${Math.round(ok/l.length*100)}%</td></tr>`}).join('')}</table></div></div>`}
 return h}
const court=()=>{cx.clearRect(0,0,800,400);cx.fillStyle='#1d4ed8';cx.fillRect(0,0,800,400);cx.fillStyle='#f97316';cx.fillRect(40,30,720,340);cx.strokeStyle='#fff';cx.lineWidth=3;cx.strokeRect(40,30,720,340);cx.beginPath();cx.moveTo(400,20);cx.lineTo(400,380);cx.stroke();cx.lineWidth=1.5;[267,533].forEach(x=>{cx.beginPath();cx.moveTo(x,30);cx.lineTo(x,370);cx.stroke()});cx.lineWidth=7;cx.beginPath();cx.moveTo(400,20);cx.lineTo(400,380);cx.stroke()};
function arrow(x1,y1,x2,y2,col){cx.strokeStyle=col;cx.fillStyle=col;cx.lineWidth=4;cx.beginPath();cx.moveTo(x1,y1);cx.lineTo(x2,y2);cx.stroke();cx.beginPath();cx.arc(x1,y1,6,0,7);cx.fill();const t=Math.atan2(y2-y1,x2-x1);cx.beginPath();cx.moveTo(x2,y2);cx.lineTo(x2-14*Math.cos(t-.4),y2-14*Math.sin(t-.4));cx.lineTo(x2-14*Math.cos(t+.4),y2-14*Math.sin(t+.4));cx.fill()}
function draw(){court();const jg=S.tab=='jg';db.acts.filter(x=>(jg?x.g==S.g:(x.a==S.a&&x.ctx!='jogo'))&&(S.fl=='Todos'||x.f==S.fl)).forEach(x=>S.hm?heat(x):arrow(x.x1*800,x.y1*400,x.x2*800,x.y2*400,GF[x.f][0]));bubs();if(drag)arrow(drag.x1,drag.y1,drag.x2,drag.y2,GF[S.fund][0])}
function pos(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/r.width*800,(e.clientY-r.top)/r.height*400]}
function initCourt(){cv=$('cv');cx=cv.getContext('2d');if(S.fs&&$('fsw'))fit();draw();
 cv.onpointerdown=e=>{const[px,py]=pos(e);let x=px,y=py;const b=S.tab=='jg'?bub().find(q=>Math.hypot(q.x-px,q.y-py)<28):null;if(b){S.a=b.id;S.ap=b.p;x=b.x;y=b.y}if(!S.a)return alert('Escolha um atleta');cv.setPointerCapture(e.pointerId);drag={x1:x,y1:y,x2:x,y2:y,rx:px,ry:py}};
 cv.onpointermove=e=>{if(drag){[drag.x2,drag.y2]=pos(e);draw()}};
 cv.onpointerup=e=>{if(!drag)return;[drag.x2,drag.y2]=pos(e);const d=drag;drag=null;const jg=S.tab=='jg';if(Math.hypot(d.x2-d.rx,d.y2-d.ry)<12){render();return}let pt=null;if(jg&&S.auto!==false){const adv=S.a=='ADV',er=['Fora','Rede','Erro','Bloqueado'].includes(S.res)&&S.fund!='Bloqueio';if(S.res=='Ponto')pt=adv?'b':'a';else if(er)pt=adv?'a':'b';if(pt)G().sets[S.set][pt]++}db.acts.push({id:uid(),a:S.a,f:S.fund,r:S.res,x1:d.x1/800,y1:d.y1/400,x2:d.x2/800,y2:d.y2/400,t:Date.now(),ctx:jg?'jogo':'treino',g:jg?S.g:undefined,set:jg?S.set:undefined,q:jg?S.q:undefined,pt:pt||undefined,ap:S.a=='ADV'?S.ap:undefined,an:S.a=='ADV'&&G()?(G().al||[])[S.ap]||undefined:undefined});save();render()}}
function undo(){const jg=S.tab=='jg';const i=db.acts.map(x=>jg?x.g==S.g:(x.a==S.a&&x.ctx!='jogo')).lastIndexOf(true);if(i>=0){unpt(db.acts[i]);db.acts.splice(i,1);save();render()}}
function heat(x){const X=x.x2*800,Y=x.y2*400,g=cx.createRadialGradient(X,Y,0,X,Y,50);g.addColorStop(0,'rgba(200,0,60,.4)');g.addColorStop(1,'rgba(200,0,60,0)');cx.fillStyle=g;cx.fillRect(X-50,Y-50,100,100)}
